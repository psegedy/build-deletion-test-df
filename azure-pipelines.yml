 pr:
   branches:
     include:
       - main
   # autoCancel defaults to true
 
 pool:
   vmImage: windows-latest
 
 stages:
 - stage: validate_closure
   displayName: Validate closure
   condition: succeeded()
   jobs:
   - job: LongRunningJob
     displayName: Long-running job
     condition: succeeded()
     timeoutInMinutes: 10
     cancelTimeoutInMinutes: 1
     steps:
     - powershell: |
         Write-Host "Starting long-running operation..."
         Start-Sleep -Seconds 300
         Write-Host "Long-running operation completed."
       displayName: Long-running script
 
